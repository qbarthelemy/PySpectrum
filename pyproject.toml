[tool.poetry]
name = "pyspectrum"
version = "0.2.0"
description = "PySpectrum is a Python package for spectral analysis"
authors = ["Quentin Barthelemy"]
license = "BSD-3-Clause"
readme = "README.md"
homepage = "https://github.com/qbarthelemy/PySpectrum"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering",
    "Topic :: Signal Processing",
]
packages = [
    { include = "pyspectrum" },
]

[tool.poetry.dependencies]
python = ">=3.11"
numpy = ">=2.0"
scipy = ">=1.12"
statsmodels = ">=0.14.5"
matplotlib = ">=3.5.0"

[tool.poetry.group.dev.dependencies]
Pillow = ">=9.2.0"
mne = ">=1.2.1"
pytest = ">=7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
